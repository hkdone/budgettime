<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion de budget Offline-First basée sur PocketBase">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BudgetTime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="theme-color" content="#0175C2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>BudgetTime</title>
  <link rel="manifest" href="manifest.json?v=v2.4.18-test1-test1-test1-test1-test1-test1-test1">

  <script>
    // The BeforeInstallPromptEvent is issued when the browser thinks the site can be installed as a PWA.
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      // Notify Flutter that the app is installable
      if (window.onAppInstallable) window.onAppInstallable();
    });

    // Function to trigger the install prompt from Flutter
    window.presentInstallPrompt = async () => {
      if (!window.deferredPrompt) return false;
      window.deferredPrompt.prompt();
      const { outcome } = await window.deferredPrompt.userChoice;
      window.deferredPrompt = null;
      return outcome === 'accepted';
    };

    // Detection for Service Worker updates
    window.onAppUpdateAvailable = null;
    function notifyUpdate() {
      if (window.onAppUpdateAvailable) window.onAppUpdateAvailable();
    }
  </script>
</head>

<body>
  <!-- Formulaire HTML de secours : aide Bitwarden / Proton Pass à détecter la page de login -->
  <form id="bt-autofill-assist" method="post" action="/login" autocomplete="on"
    style="position:absolute;width:0;height:0;opacity:0;overflow:hidden;pointer-events:none"
    aria-hidden="true">
    <input id="bt-autofill-user" name="username" type="text" autocomplete="username" tabindex="-1">
    <input id="bt-autofill-pass" name="password" type="password" autocomplete="current-password"
      tabindex="-1">
  </form>

  <script>
    (function () {
      var userEl = document.getElementById('bt-autofill-user');
      var passEl = document.getElementById('bt-autofill-pass');
      if (!userEl || !passEl) return;

      function syncAutofill() {
        var username = userEl.value || '';
        var password = passEl.value || '';
        if (username || password) {
          window.btAutofillCredentials = { username: username, password: password };
        }
      }

      ['input', 'change'].forEach(function (evt) {
        userEl.addEventListener(evt, syncAutofill);
        passEl.addEventListener(evt, syncAutofill);
      });
      // Chrome signale l'autofill navigateur via animationstart sur le champ
      passEl.addEventListener('animationstart', syncAutofill);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Handle Service Worker updates
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then((registration) => {
        registration.onupdatefound = () => {
          const installingWorker = registration.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New content is available, notify the app
              notifyUpdate();
            }
          };
        };
      });
    }
  </script>
</body>

</html>
